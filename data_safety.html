<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Safety - QALB</title>
    <link rel="stylesheet" href="terms.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<nav>
    QALB
</nav>
<body>
    
    <div class="terms-container">
        <div id="terms-content">
            <!-- Markdown content will be loaded here -->
        </div>
    </div>

    <script>
        // Fetch and render the markdown file
        fetch('data_safety.md')
            .then(response => response.text())
            .then(markdown => {
                document.getElementById('terms-content').innerHTML = marked.parse(markdown);
            })
            .catch(error => {
                console.error('Error loading terms:', error);
                document.getElementById('terms-content').innerHTML = '<h1>Error loading terms</h1><p>Please try again later.</p>';
            });
    </script>
</body>
</html>
